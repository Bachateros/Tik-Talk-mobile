name: tik_talk
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  go_router: ^14.0.0
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  web_socket_channel: ^3.0.1
  flutter_bloc: ^8.1.5
  get_it: ^7.2.0
  url_launcher: ^6.3.0
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.29.0
  build_runner: ^2.9.0

flutter:
  uses-material-design: true

  assets:
    - images/light_theme_logo.png
    - images/light_them_logo1.png
    - images/dark_theme_logo.png
    - images/dark_theme_logo1.png
    - images/dark_theme.png
    - images/light_theme.png
    - images/dark_theme_serch_bar.png

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/light_them_logo1.png"
